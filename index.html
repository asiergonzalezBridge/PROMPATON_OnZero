<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍏ONzero🍏</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-50 min-h-screen p-4 md:p-8">

```
<div class="max-w-5xl mx-auto">

    <!-- HEADER + GAMIFICACIÓN -->
    <header class="text-center mb-10">
        <h1 class="text-4xl font-bold text-green-700">🍏 on zero 🍏</h1>

        <div id="puntos" style="display: none;" class="bg-yellow-100 py-1 px-6 rounded-full inline-block mt-3 font-bold text-yellow-800 shadow">
            Eco-Puntos: 0 
        </div>

        <!-- BARRA DE PROGRESO -->
        <div class="mt-4 max-w-md mx-auto">
            <div class="w-full bg-gray-200 rounded-full h-4">
                <div id="barraProgreso"
                    class="bg-green-600 h-4 rounded-full text-xs text-white text-center"
                    style="width: 0%">
                    0%
                </div>
            </div>

            <p id="impacto" class="text-sm text-green-700 mt-2 font-semibold">
                Has evitado desperdiciar 0 alimentos
            </p>
        </div>
    </header>

    <!-- CONTENIDO -->
    <main class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- COLUMNA IZQUIERDA -->
        <section>

            <!-- FILTROS -->
            <div class="bg-white p-6 rounded-2xl shadow-sm mb-6">
                <h3 class="text-sm font-bold text-gray-400 mb-3 uppercase">Preferencias:</h3>
                <div id="filtrosContainer" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- INGREDIENTES -->
            <div class="bg-white p-6 rounded-2xl shadow-sm">
                <h2 class="font-bold text-green-800 mb-4 text-xl">🥕 ¿Qué tienes en casa?</h2>
                
                <input type="text" id="ingredientesInput" 
                    placeholder="Ej: pollo, arroz, tomate" 
                    class="w-full p-3 border rounded-xl mb-3">

                <button onclick="aplicarIngredientes()" 
                    class="w-full bg-green-600 text-white rounded-xl p-3 font-bold hover:bg-green-700 transition">
                    Generar recetas
                </button>
                
                <div id="listaRecetas" class="mt-6 space-y-4"></div>
            </div>

        </section>

        <!-- COLUMNA DERECHA -->
        <section class="space-y-6">

            <!-- EXCEDENTES -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-yellow-500">
                <h2 class="font-bold text-yellow-700 mb-2 text-xl">♻️ Aprovechamiento de la Amama</h2>

                <input type="text" id="excedenteInput" 
                    placeholder="Ej: pan" 
                    class="w-full p-3 border rounded-xl">

                <button onclick="verExcedente()" 
                    class="w-full mt-3 bg-yellow-500 text-white rounded-xl p-3 font-bold hover:bg-yellow-600 transition">
                    Ver ideas
                </button>

                <p id="resultadoExcedente" 
                    class="mt-4 p-3 bg-yellow-50 rounded-lg text-gray-700 italic hidden">
                </p>
            </div>

            <!-- LISTA COMPRA -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border-t-4 border-green-500">
                <h2 class="font-bold text-green-800 mb-4 text-xl">🛒 Lista de la Compra</h2>

                <ul id="shoppingList" 
                    class="text-gray-600 list-disc pl-5 space-y-1 mb-4">
                </ul>

                <div class="flex gap-2">
                    <input type="text" id="nuevoItem" 
                        placeholder="Añadir..." 
                        class="flex-1 p-2 border rounded-lg">

                    <button onclick="agregarALista()" 
                        class="bg-green-600 text-white px-4 rounded-lg font-bold">
                        +
                    </button>
                </div>
            </div>

        </section>

    </main>

</div>

<!-- SCRIPTS -->
<script src="mock.js"></script>
<script src="scripts.js"></script>
```

</body>
</html>
